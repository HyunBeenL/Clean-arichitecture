# ch09 · 배차 REST 규약을 따르지 않는 택시 회사만 여기에 적는다.
#
# 표준 규약: {baseUri}/driver/{기사}/pickupAddress/{승차지}/pickupTime/{시각}/destination/{목적지}
#
# 형식: <호스트>.<항목>=<그 회사가 실제로 쓰는 경로 이름>
# 항목: driver, pickupAddress, pickupTime, destination
#
# 회사가 도메인을 바꾸거나 규약을 어기는 회사가 새로 생기면 이 파일만 고친다.
# DispatchUriBuilder 는 열지 않는다.

acme.com.destination=dest
